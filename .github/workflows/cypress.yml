# Simple GitHub Actions pipeline for Cypress
# Roda testes em headless quando houver PR para main ou push em branches release

name: Cypress Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'release*'

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests (headless)
        run: npx cypress run

      - name: Generate consolidated Mochawesome HTML report
        run: |
          npx mochawesome-merge cypress/reports/*.json > cypress/reports/report.json
          npx mochawesome-report-generator cypress/reports/report.json -o cypress/reports/mochawesome.html

      - name: Upload Mochawesome Report
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/reports/
